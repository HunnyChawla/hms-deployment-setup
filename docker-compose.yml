version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-hms-postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hms_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hms_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network
    restart: unless-stopped

  # Redis — caches the ABDM gateway session token for abdm-lib.
  #
  # Required by any ABHA/ABDM flow. NOT used by the background job queue, which
  # is a Postgres outbox, so Redis being down does not stop background work.
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-hms-redis}
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network
    restart: unless-stopped
      retries: 5
    networks:
      - hms-network
    restart: unless-stopped

  # HMS Platform Backend (FastAPI)
  hms-backend:
    image: technesian/${BACKEND_CONTAINER_NAME:-hms-platform-backend}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: ../hms-platform-backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-hms-platform-backend}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hms_db}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      APP_ENV: ${APP_ENV:-production}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DOCS_USERNAME: ${DOCS_USERNAME:-}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LICENSE_ENCRYPTION_KEY: ${LICENSE_ENCRYPTION_KEY:-CHANGE_THIS_GENERATE_STRONG_ENCRYPTION_KEY_MIN_32_CHARS}
      AADHAAR_ENCRYPTION_KEY: ${AADHAAR_ENCRYPTION_KEY:-}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      REDIS_URL: redis://redis:6379/0
      # ABDM / ABHA Integration
      ABDM_BASE_URL: ${ABDM_BASE_URL:-https://abhasbx.abdm.gov.in}
      ABDM_CLIENT_ID: ${ABDM_CLIENT_ID:-}
      ABDM_CLIENT_SECRET: ${ABDM_CLIENT_SECRET:-}
      ABDM_X_CM_ID: ${ABDM_X_CM_ID:-sbx}
      ABDM_HIP_ID: ${ABDM_HIP_ID:-IN0610090730}
      ABDM_PHR_BASE_URL: ${ABDM_PHR_BASE_URL:-https://phrsbx.abdm.gov.in}
      ABDM_HIECM_BASE_URL: ${ABDM_HIECM_BASE_URL:-https://abhasbx.abdm.gov.in}
      ABDM_BRIDGE_URL: ${ABDM_BRIDGE_URL:-}
      ABDM_BRIDGE_API_KEY: ${ABDM_BRIDGE_API_KEY:-}
      ABDM_BRIDGE_CALLBACK_URL: ${ABDM_BRIDGE_CALLBACK_URL:-}
      ABDM_CALLBACK_BASE_URL: ${ABDM_CALLBACK_BASE_URL:-}
      ABDM_CALLBACKS_ENABLED: ${ABDM_CALLBACKS_ENABLED:-false}
      ABDM_CALLBACK_ISSUER: ${ABDM_CALLBACK_ISSUER:-https://dev.abdm.gov.in/auth/realms/central-registry}
      ABDM_JWKS_URI: ${ABDM_JWKS_URI:-}
      ABDM_CALLBACK_IP_ALLOW_LIST: ${ABDM_CALLBACK_IP_ALLOW_LIST:-}

      # Messaging, Intake & Patient Matching
      INTAKE_TOKEN_EXPIRY_MINUTES: ${INTAKE_TOKEN_EXPIRY_MINUTES:-120}
      MATCH_AGE_TOLERANCE_YEARS: ${MATCH_AGE_TOLERANCE_YEARS:-2}
      MATCH_NAME_PHONETIC_THRESHOLD: ${MATCH_NAME_PHONETIC_THRESHOLD:-0.85}
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      SMS_INLINE_TIMEOUT_SECONDS: ${SMS_INLINE_TIMEOUT_SECONDS:-5.0}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_THROTTLE_PER_HOUR: ${OTP_THROTTLE_PER_HOUR:-5}

      # OpenTelemetry & Grafana Cloud Observability
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hms-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=production,service.namespace=hms}
    ports:
      - "${APP_PORT:-8153}:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hms-network
    restart: unless-stopped

  # Background job worker.
  #
  # SAME published image as hms-backend, different entry command — a separate
  # container, not a separate service. No extra build and no separate CI: it is
  # the same artifact running the queue drainer instead of uvicorn.
  #
  # Runs no migrations (hms-backend's entrypoint owns those) and exposes no
  # ports. The API does not depend on it being up: jobs accumulate as PENDING
  # and drain when it returns.
  hms-worker:
    image: technesian/${BACKEND_CONTAINER_NAME:-hms-platform-backend}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${WORKER_CONTAINER_NAME:-hms-worker}
    command: [ "python", "-m", "hms.jobs.worker" ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hms_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars-please}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LICENSE_ENCRYPTION_KEY: ${LICENSE_ENCRYPTION_KEY:-CHANGE_THIS_GENERATE_STRONG_ENCRYPTION_KEY_MIN_32_CHARS}
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2.0}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_STALE_LOCK_SECONDS: ${WORKER_STALE_LOCK_SECONDS:-300}
    volumes:
      # MUST be the same bind paths as hms-backend. From Phase 2 the worker
      # renders documents the API serves, so they have to share a filesystem.
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hms-network
    restart: unless-stopped

  # Hospital UI (Next.js Frontend)
  hospital-ui:
    image: technesian/${FRONTEND_CONTAINER_NAME:-hospital-ui}:${FRONTEND_IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: ../hospital-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_DOMAIN_URL: ${NEXT_PUBLIC_DOMAIN_URL:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: ${FRONTEND_CONTAINER_NAME:-hospital-ui}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_DOMAIN_URL: ${NEXT_PUBLIC_DOMAIN_URL:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "${FRONTEND_PORT:-8154}:80"
    depends_on:
      hms-backend:
        condition: service_healthy
    networks:
      - hms-network
    restart: unless-stopped

  # TV Legacy Display (Simple HTML/JS for old TVs)
  tv-legacy:
    image: technesian/${TV_LEGACY_CONTAINER_NAME:-tv-legacy-display}:${TV_LEGACY_IMAGE_TAG:-latest}
    pull_policy: always
    build:
      context: ../hospital-ui/tv-legacy
      dockerfile: Dockerfile
    container_name: ${TV_LEGACY_CONTAINER_NAME:-tv-legacy-display}
    environment:
      API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PORT: 5500
    ports:
      - "${TV_LEGACY_PORT:-8156}:5500"
    depends_on:
      hms-backend:
        condition: service_healthy
    networks:
      - hms-network
    restart: unless-stopped

  # Cura E2E Test Runner & Observability Dashboard
  hms-e2e-runner:
    image: technesian/${E2E_CONTAINER_NAME:-hms-e2e-runner}:${E2E_IMAGE_TAG:-latest}
    build:
      context: ../e2e-tests
      dockerfile: Dockerfile
    container_name: ${E2E_CONTAINER_NAME:-hms-e2e-runner}
    environment:
      BASE_URL: ${E2E_BASE_URL:-http://hospital-ui:80}
      API_URL: ${E2E_API_URL:-http://hms-backend:8000}
      HOSPITAL_ID: ${E2E_HOSPITAL_ID:-demo-hospital}
      ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-admin@demo.com}
      ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-admin123}
      PORT: ${E2E_PORT:-8158}
      PLAYWRIGHT_UI_PORT: ${E2E_PLAYWRIGHT_UI_PORT:-8159}
      BASE_PATH: ${E2E_BASE_PATH:-}
      EMERGENCY_ADMIN_PASS: ${EMERGENCY_ADMIN_PASS:-admin123}
      CI: "1"
    ports:
      - "${E2E_PORT:-8158}:8158"
      - "${E2E_PLAYWRIGHT_UI_PORT:-8159}:8159"
    volumes:
      - ../e2e-tests/tests:/app/tests
      - ../e2e-tests/src:/app/src
      - ../e2e-tests/playwright-report:/app/playwright-report
      - ../e2e-tests/test-results:/app/test-results
      - ../e2e-tests/run-history:/app/run-history
    depends_on:
      - hospital-ui
      - hms-backend
    networks:
      - hms-network
    restart: unless-stopped

networks:
  hms-network:
    name: hms-network
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
