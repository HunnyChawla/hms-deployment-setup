# ==============================================================================
# HMS Production Hardened Reverse Proxy Configuration
# ==============================================================================
# Features:
# - Enforces TLS 1.2 and TLS 1.3 only (rejects obsolete SSLv3, TLS 1.0, TLS 1.1)
# - Enables HTTP/2 with ALPN negotiation
# - Explicitly blocks obsolete HTTP/1.0 and HTTP/0.9 (returns HTTP 426)
# - Mitigates HTTP/2-to-HTTP/1.1 request smuggling (H2.CL / H2.TE desync)
# - Strips client-supplied Transfer-Encoding when proxying to upstream backends
# - Sanitizes hop-by-hop Connection and Upgrade headers
# ==============================================================================

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Plaintext HTTP -> HTTPS Permanent Redirect (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Block obsolete HTTP protocols even on port 80
    if ($server_protocol !~* "^HTTP/(1\.1|2(\.0)?)$") {
        return 426 "HTTP/1.1 or HTTP/2 is required";
    }

    # Redirect all traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server (Port 443)
server {
    # Modern Nginx syntax (1.25.1+): 'listen 443 ssl;' with 'http2 on;'
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # For Nginx < 1.25.1, comment 'http2 on;' above and uncomment below:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name yourhospital.com *.yourhospital.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/yourhospital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourhospital.com/privkey.pem;

    # Secure Protocol & Cipher Configuration (Mozilla Modern/Intermediate Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Suppress version banner
    server_tokens off;

    # Header parsing safety & smuggling mitigation
    ignore_invalid_headers on;
    underscores_in_headers off;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 25M;

    # Protocol Downgrade Prevention: explicitly reject obsolete HTTP/1.0 and HTTP/0.9
    if ($server_protocol !~* "^HTTP/(1\.1|2(\.0)?)$") {
        return 426 "HTTP/1.1 or HTTP/2 is required";
    }

    # Default proxy headers for all upstream services
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Anti-Request-Smuggling Defense: Strip client-supplied Transfer-Encoding
    # when translating HTTP/2 to upstream HTTP/1.1
    proxy_set_header Transfer-Encoding "";

    # Security Headers (Defense-in-depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # --------------------------------------------------------------------------
    # Service Routing
    # --------------------------------------------------------------------------

    # ABDM Callbacks (from ABDM Gateway or abdm-bridge)
    location /abdm/callback/ {
        proxy_pass http://127.0.0.1:8155;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # HMS Platform Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8155;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8155/health;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Cura E2E Test Runner & Terminal (Subpath routing)
    location /e2e/ {
        proxy_pass http://127.0.0.1:8158;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hospital UI (Frontend Next.js Static / SPA)
    location / {
        proxy_pass http://127.0.0.1:8154;
        proxy_read_timeout 60s;
    }
}
